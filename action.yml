name: watchdep
description: Watch every layer of your dependencies for known vulnerabilities and compromised releases, with watchdep.
author: kimathinjoki
branding:
  icon: shield
  color: gray-dark

inputs:
  command:
    description: "What to run: scan, check, fix, gate or deployed."
    required: true
  args:
    description: "More arguments for the command, for example --fail-on malicious,kev,severe or --image app.tar."
    required: false
    default: ""
  working-directory:
    description: "The part's folder."
    required: false
    default: "."
  version:
    description: "The watchdep CLI release to use, one this Action carries checksums for (checksums/). There is no default and no latest."
    required: true
  server:
    description: "The watchdep service's address (for scan, check, fix and deployed)."
    required: false
    default: ""
  token:
    description: "The part's watchdep token (keep it in a secret)."
    required: false
    default: ""
  github-token:
    description: "The repository's own token, which watchdep fix uses to open pull requests (it never merges)."
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "The watchdep command's exit code."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install watchdep ${{ inputs.version }}
      shell: bash
      env:
        WATCHDEP_VERSION: ${{ inputs.version }}
      run: "\"$GITHUB_ACTION_PATH/install.sh\""

    - name: watchdep ${{ inputs.command }}
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        WATCHDEP_COMMAND: ${{ inputs.command }}
        WATCHDEP_ARGS: ${{ inputs.args }}
        WATCHDEP_SERVER: ${{ inputs.server }}
        WATCHDEP_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: "\"$GITHUB_ACTION_PATH/run.sh\""
