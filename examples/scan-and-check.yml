# Send each push's inventory to watchdep, and the code check's draft verdicts.
name: watchdep
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  watchdep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the Action by commit SHA, never by a moving tag.
      - uses: kimathinjoki/watchdep-action@<commit-sha>
        with:
          version: 0.3.0   # a release listed in the Action's checksums/
          command: scan
          server: https://watchdep.example.com
          token: ${{ secrets.WATCHDEP_TOKEN }}
      - uses: kimathinjoki/watchdep-action@<commit-sha>
        with:
          version: 0.3.0   # a release listed in the Action's checksums/
          command: check
          server: https://watchdep.example.com
          token: ${{ secrets.WATCHDEP_TOKEN }}
