name: depwatch
description: Watch every layer of your dependencies for known vulnerabilities and compromised releases, with depwatch.
author: kimathinjoki
branding:
  icon: shield
  color: gray-dark

inputs:
  command:
    description: "What to run: scan, check, fix, gate or deployed."
    required: true
  args:
    description: "More arguments for the command, for example --fail-on malicious,kev,severe or --image app.tar."
    required: false
    default: ""
  working-directory:
    description: "The part's folder."
    required: false
    default: "."
  version:
    description: "The depwatch CLI release to use. The Action verifies it against the checksums it carries for that version."
    required: false
    default: "0.1.0"
  server:
    description: "The depwatch server (for scan, check, fix and deployed)."
    required: false
    default: ""
  token:
    description: "The part's depwatch token (keep it in a secret)."
    required: false
    default: ""
  github-token:
    description: "The repository's own token, which depwatch fix uses to open pull requests (it never merges)."
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "The depwatch command's exit code."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install depwatch ${{ inputs.version }}
      shell: bash
      env:
        DEPWATCH_VERSION: ${{ inputs.version }}
      run: "\"$GITHUB_ACTION_PATH/install.sh\""

    - name: depwatch ${{ inputs.command }}
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEPWATCH_COMMAND: ${{ inputs.command }}
        DEPWATCH_ARGS: ${{ inputs.args }}
        DEPWATCH_SERVER: ${{ inputs.server }}
        DEPWATCH_TOKEN: ${{ inputs.token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: "\"$GITHUB_ACTION_PATH/run.sh\""
