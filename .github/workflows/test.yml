name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer and runner tests
        run: bash tests/install_test.sh
      - name: shellcheck
        run: shellcheck install.sh run.sh tests/install_test.sh
