# In the deploy job, after the deployment succeeds: production becomes what was deployed.
      - uses: kimathinjoki/watchdep-action@<commit-sha>
        with:
          version: 0.1.0   # a release listed in the Action's checksums/
          command: scan
          args: --image app.tar
          server: https://watchdep.example.com
          token: ${{ secrets.WATCHDEP_TOKEN }}
      - uses: kimathinjoki/watchdep-action@<commit-sha>
        with:
          version: 0.1.0   # a release listed in the Action's checksums/
          command: deployed
          args: --sha ${{ github.sha }}
          server: https://watchdep.example.com
          token: ${{ secrets.WATCHDEP_TOKEN }}
