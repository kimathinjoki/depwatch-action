# Open (or update) one pull request per finding the workspace wants fixed by pull request.
# The repository's own token opens them; a person reviews and merges. watchdep never merges.
name: watchdep fix
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Set up the project's package manager first, as its own CI does.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: kimathinjoki/watchdep-action@<commit-sha>
        with:
          version: 0.1.0   # a release listed in the Action's checksums/
          command: fix
          server: https://watchdep.example.com
          token: ${{ secrets.WATCHDEP_TOKEN }}
