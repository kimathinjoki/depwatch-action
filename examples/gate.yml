# Stop a pull request's build on a malicious release, an exploited-now finding or anything severe.
# No server needed: the gate checks OSV, CISA KEV and EPSS directly.
name: watchdep gate
on: [pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kimathinjoki/watchdep-action@<commit-sha>
        with:
          version: 0.3.0   # a release listed in the Action's checksums/
          command: gate
          args: --fail-on malicious,kev,severe
